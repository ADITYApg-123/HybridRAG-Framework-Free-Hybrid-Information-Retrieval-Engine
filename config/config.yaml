project:
  name: "HybridRAG"
  version: "1.0.0"

paths:
  raw_data_dir: "data/raw"
  processed_chunks_path: "data/processed/chunks.jsonl"
  faiss_index_path: "data/index/faiss_flatip.index"
  bm25_index_path: "data/index/bm25_store.pkl"
  metadata_store_path: "data/index/chunk_metadata.json"
  golden_dataset_path: "data/evaluation/golden_queries.json"
  eval_results_path: "data/evaluation/benchmark_results.json"

chunking:
  # Tuned to fit inside all-MiniLM-L6-v2's 256-WorkPiece token sequence window (~180-200 words)
  max_tokens: 190
  overlap_tokens: 35
  prepend_header: true

retrieval:
  top_k_fetch: 60
  top_k_final: 5
  rrf_k: 60

model:
  embedding: "all-MiniLM-L6-v2"
  embedding_dim: 384
  llm: "gemini-2.5-flash"
  temperature: 0.1
  max_output_tokens: 1024

logging:
  level: "INFO"
